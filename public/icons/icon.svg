<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#030712"/>

  <defs>
    <!-- Top tail: fades from solid at base (y≈251) toward tip (y≈338) -->
    <linearGradient id="tt" x1="123" y1="251" x2="51" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#42d6a4" stop-opacity="1"  />
      <stop offset="100%" stop-color="#42d6a4" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Bottom tail: fades from solid at base (y≈261) toward tip (y≈174) -->
    <linearGradient id="bt" x1="389" y1="261" x2="461" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#42d6a4" stop-opacity="1"  />
      <stop offset="100%" stop-color="#42d6a4" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Top chat bubble body — upper-right, rx≈67 -->
  <rect x="82" y="26" width="389" height="225" rx="67" fill="#42d6a4"/>
  <!-- Top tail — bottom-left exit, fades to tip -->
  <path d="M 143 251 Q 82 251 51 338 Q 102 282 164 251 Z" fill="url(#tt)"/>

  <!-- Bottom chat bubble body — lower-left, rx≈67 -->
  <rect x="41" y="261" width="389" height="225" rx="67" fill="#42d6a4"/>
  <!-- Bottom tail — top-right exit, fades to tip -->
  <path d="M 369 261 Q 430 261 461 174 Q 410 230 348 261 Z" fill="url(#bt)"/>
</svg>
